name: Secret false positive
description: secret-leak-check flagged something that is safe to ship.
title: "[false positive] "
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real secrets.** Redact every key and token. If a real credential was exposed, rotate it first.
  - type: input
    id: target
    attributes:
      label: Target
      description: The preview URL or build directory you scanned.
      placeholder: https://example-preview.vercel.app or ./dist
    validations:
      required: true
  - type: input
    id: finding
    attributes:
      label: What was flagged
      description: Pattern type and file or line.
      placeholder: OpenAI API key at assets/app.js:12
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: Paste the report with every secret redacted.
      render: shell
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is safe
      description: Public-by-design key, test fixture, server-side only, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x / Cursor 2.x / Codex 0.x
