name: Missed secret
description: The skill did not flag something that should have been caught.
title: "[missed secret] "
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real secrets.** Redact every key and token. If a real credential was exposed, rotate it first.
  - type: input
    id: secret_type
    attributes:
      label: Secret type
      placeholder: OpenAI key, Stripe secret, private key, service_role JWT
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where it appeared
      placeholder: /assets/app.js:12 or a build directory
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Redacted sample
      description: Show only a prefix, a suffix, or a clearly fake value. Never the full secret.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: The preview URL or build directory you scanned.
      placeholder: https://example-preview.vercel.app or ./dist
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected the skill to report.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x / Cursor 2.x / Codex 0.x
