name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test-audit fixture
        run: python -B -m unittest discover -s examples/weak-tests -v
      - name: Regression fixture (before)
        run: python -B -m unittest discover -s examples/regression-demo/before -v
      - name: Regression fixture (after)
        run: python -B -m unittest discover -s examples/regression-demo/after -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Markdown links and skill frontmatter
        run: python .github/scripts/check_docs.py
